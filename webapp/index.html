<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>VDS RPG : Между Мирами</title>
<link rel="stylesheet" href="/app/style.css?v=20261111m">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="topbar">
  <div class="tb-side">
    <span id="tb-name" class="tb-name"></span>
    <span id="tb-level" class="tb-chip"></span>
  </div>
  <div class="tb-side tb-right">
    <span id="tb-dark" class="tb-chip"></span>
    <span id="tb-egez" class="tb-chip"></span>
  </div>
</div>
<div id="rotate">🔄 Поверните устройство — VDS RPG работает в горизонтальной ориентации</div>
<div id="screen"><div class="loading">⏳ Загрузка VDS RPG…</div></div>
<div id="menu_overlay" class="hidden">
  <div class="m-box">
    <button class="m-x" onclick="closeMenu(event)">✕</button>
    <div class="m-list">
      <button class="m-btn" onclick="closeMenu(event);goMenu()">🏠 Главное меню</button>
      <button class="m-btn" onclick="closeMenu(event);goChars()">🎭 Персонажи</button>
      <button class="m-btn" onclick="closeMenu(event);goShop()">🛒 Магазин</button>
      <button class="m-btn" onclick="closeMenu(event);goInv()">🎒 Инвентарь</button>
      <button class="m-btn" onclick="closeMenu(event);goProfile()">👤 Профиль</button>
      <button class="m-btn hidden" id="m-admin" onclick="closeMenu(event);goAdmin()">🛠 Админка</button>
      <button class="m-btn" onclick="closeMenu(event);goBattle()">▶ К бою</button>
    </div>
  </div>
</div>
<div id="modal" class="hidden"><div class="m-box" id="modal-box"></div></div>
<div id="toast" class="hidden"></div>
<script src="/app/app.js?v=20261112a"></script>
</body>
</html>
